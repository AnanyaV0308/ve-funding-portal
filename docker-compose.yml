# Local Postgres for development. Production uses Supabase (Mumbai), which is also plain Postgres.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ve
      POSTGRES_PASSWORD: ve
      POSTGRES_DB: ve_funding
    ports:
      - "5432:5432"
    volumes:
      - ve-db:/var/lib/postgresql/data
volumes:
  ve-db:
